name: One-time SEO hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live research page metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r'<title>.*?</title>',
              '<title>Quest-MFTS — Meta Quest XR Simulation & Multimodal Interface Research | Joe Nasr</title>',
              s,
              count=1,
              flags=re.S,
          )

          marker = '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
          seo = '''
    <!-- SEO_HARDENED_BY_JOE_NASR -->
    <meta name="description" content="Quest-MFTS by Joe Nasr explores Meta Quest XR simulation, gaze, voice, haptics, HOTAS and mixed-reality systems for builders, engineers and educators.">
    <meta name="author" content="Joe Nasr">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
    <link rel="canonical" href="https://joenasriani.github.io/quest-mfts/">
    <meta property="og:type" content="article">
    <meta property="og:title" content="Quest-MFTS — Meta Quest XR Simulation & Multimodal Interface Research">
    <meta property="og:description" content="A Joe Nasr / QuestRequestVR feasibility study on Meta Quest, OpenXR, gaze, voice, haptics, HOTAS and mixed-reality simulation interfaces.">
    <meta property="og:url" content="https://joenasriani.github.io/quest-mfts/">
    <meta name="twitter:card" content="summary">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TechArticle",
      "headline": "Quest-MFTS — Multi-Function Tactical Simulation System for Meta Quest",
      "description": "Systems concept and feasibility study for multimodal Meta Quest simulation using gaze, voice, haptics, HOTAS, OpenXR and mixed reality.",
      "url": "https://joenasriani.github.io/quest-mfts/",
      "mainEntityOfPage": "https://joenasriani.github.io/quest-mfts/",
      "author": {
        "@type": "Person",
        "name": "Joe Nasr",
        "url": "https://joenasriani.github.io/joe-research-registry/author/joe-nasr.html",
        "sameAs": [
          "https://github.com/Joenasriani",
          "https://linktr.ee/questrequestvr"
        ]
      },
      "about": [
        {"@type":"Thing","name":"Meta Quest"},
        {"@type":"Thing","name":"Extended reality"},
        {"@type":"Thing","name":"Virtual reality"},
        {"@type":"Thing","name":"Mixed reality"},
        {"@type":"Thing","name":"OpenXR"},
        {"@type":"Thing","name":"Human-computer interaction"},
        {"@type":"Thing","name":"Simulation"}
      ]
    }
    </script>'''

          if 'SEO_HARDENED_BY_JOE_NASR' not in s and marker in s:
              s = s.replace(marker, marker + seo, 1)

          s = s.replace('https://joenasraiani.github.io/quest-mfts/', 'https://joenasriani.github.io/quest-mfts/')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit metadata changes
        shell: bash
        run: |
          git config user.name "Joe Nasr SEO Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Harden live page metadata and canonical research attribution"
            git push
          fi
